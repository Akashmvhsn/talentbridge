# Render Blueprint: one web service runs the API and serves the built React app.
# Deploy: push this repo to GitHub -> Render dashboard -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: talentbridge
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
